name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Types (pyright strict), lint, format, tests, and the frontend's generated API
  # types being in sync with the backend: the same `make check` as locally.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check
      - run: npm run build
        working-directory: frontend
