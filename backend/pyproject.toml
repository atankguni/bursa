# Tool configuration (ruff / pyright / pytest). Runtime deps live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ANN"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "ANN401", # Any is allowed where it is genuinely dynamic (governor, DB-API hooks)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"] # fixtures/test doubles don't need annotations

[tool.ruff.lint.isort]
known-first-party = ["assistant", "config", "database", "deps", "market", "models", "routers", "schemas", "scheduler", "services"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["."]
# Tests use partial dicts / SimpleNamespace doubles on purpose.
exclude = ["data", "tests", "**/__pycache__", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
