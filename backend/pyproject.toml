# Tool configuration (ruff / pytest). Runtime deps live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"] # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["config", "database", "deps", "market", "models", "routers", "schemas", "scheduler", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
