# Alembic (schema migrations). The app runs these itself on startup
# (db/migrate.py); this file is for the CLI, e.g. after changing models.py:
#
#   alembic revision --autogenerate -m "add foo column"
#   alembic upgrade head
#
# The database URL comes from config.settings (DATABASE_URL), not from here.
[alembic]
script_location = %(here)s/migrations
# Files are named by creation time (Jakarta), e.g. 20261022_2057_rating_snapshots.py;
# env.py gives new revisions a matching id (YYYYMMDD_HHMMSS). Alembic orders
# migrations by each file's down_revision, not by name.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = Asia/Jakarta
# Run env.py for every `alembic revision` (not only --autogenerate), so the id hook applies.
revision_environment = true
prepend_sys_path = .
