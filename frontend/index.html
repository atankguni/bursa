<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bursa — IDX Stock Monitor</title>

    <!-- Favicons. ?v=3 busts Chromium's cached (previously broken) bitmap; the
         .ico is a real rel="icon" (Chromium ignores rel="alternate icon"). -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Browser chrome color per theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <!-- Apply saved settings before first paint to avoid a flash. -->
    <script>
      ;(function () {
        try {
          var s = {}
          try {
            s = JSON.parse(localStorage.getItem('bursa-settings') || '{}') || {}
          } catch (e) {}
          var theme = s.theme || localStorage.getItem('bursa-theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          el.classList.toggle('dark', dark)
          el.setAttribute('data-density', s.density || 'medium')
          if (s.reduceMotion) el.setAttribute('data-reduce-motion', '')
          if (s.highContrast) el.setAttribute('data-high-contrast', '')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
