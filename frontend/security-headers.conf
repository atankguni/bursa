# Security headers, included by the server and by every location that sets its
# own add_header (nginx drops inherited add_header lines in such locations).
#
# CSP: scripts, data and fonts only from this origin (no inline scripts: the
# theme bootstrap is /theme-init.js). Inline *styles* are allowed: charting and
# UI libraries set them. data: images = the 2FA QR code. No framing at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs on the TLS-terminating proxy in front of this one (this serves HTTP).
