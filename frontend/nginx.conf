# Static host for the built SPA + reverse proxy to the backend API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Compress text responses on the way out.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hashed build assets never change -> cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The entry HTML must always revalidate so new builds are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Not content-hashed either: revalidate so a new build's version is used.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Icons / manifest: medium cache.
    location ~* \.(ico|svg|png|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy API calls to the backend service (same-origin -> no CORS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
