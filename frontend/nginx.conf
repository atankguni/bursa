# Static host for the built SPA + reverse proxy to the backend API.

# Request rate limits, per client address (the real one: see set_real_ip_from
# below). Sign-in, 2FA codes, password-reset mail and invites are POSTs to
# /api/auth: 10 a minute. Its GETs (/me, /options, polled by the app) are not
# limited there. The API as a whole: 30 a second, far above what pages use.
map $request_method $auth_write_client {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $auth_write_client  zone=auth_writes:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m         rate=30r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The client's address. Tailscale (`tailscale serve`, or another proxy on
    # this machine) connects from the host / Docker network and passes the
    # real address in X-Forwarded-For; trust that header only from there. The
    # port is published on 127.0.0.1 (docker-compose.yml), so nothing else can
    # send it. The backend's sign-in throttling relies on this address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/snippets/security-headers.conf;

    # Compress text responses on the way out.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hashed build assets never change -> cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The entry HTML must always revalidate so new builds are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Not content-hashed either: revalidate so a new build's version is used.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Icons / manifest: medium cache.
    location ~* \.(ico|svg|png|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy API calls to the backend service (same-origin -> no CORS).
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/ {
        limit_req zone=auth_writes burst=10 nodelay;
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Over a limit: the API's error shape, so the app shows the message.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 429 '{"detail":"Too many requests. Wait a minute and try again."}';
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
