# Bursa — single, production-grade stack.
#
#   docker compose up --build
#
# Backend  : FastAPI      -> http://localhost:8000  (docs at /docs; this machine only)
# Worker   : scheduler + background jobs (same image; no port)
# Frontend : nginx static -> http://localhost:5173  (proxies /api to backend;
#            this machine only: reach it from elsewhere with `tailscale serve`,
#            see docs/getting-started.md)
# SQLite   : ./backend/data/bursa.db (persisted on the host, WAL mode)
#
# The frontend image builds the SPA and serves it with nginx; the backend runs
# without hot-reload. For live-reload while coding, run the dev servers locally
# (see README "Development") — no separate compose file needed.

services:
  backend:
    image: bursa-backend
    build:
      context: ./backend
      target: runtime # the Dockerfile also has a `test` stage
    # Secrets (GEMINI_API_KEY) live here, outside the image and outside git.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bursa.db
    volumes:
      # Persist only the database.
      - ./backend/data:/app/data
    # Least privilege: no root (set in the images), read-only filesystem except
    # the data volume and /tmp, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Loopback only: other machines reach the API through nginx (which sets the
    # client IP header the backend trusts), never directly.
    ports:
      - "127.0.0.1:8000:8000"
    # Healthy once prepare.py has migrated the database and the API answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  # Scheduler and every background job (syncs, alerts, digests, backups), so a
  # slow provider or failing job never slows the API. Exactly one: the jobs
  # would otherwise run twice. Talks to the API only through the database.
  worker:
    image: bursa-backend
    command: ["python", "worker.py"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bursa.db
    volumes:
      - ./backend/data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    # Least privilege: no root (set in the images), read-only filesystem except
    # the data volume and /tmp, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Let a running sync save its progress before the container stops.
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    image: bursa-frontend
    build:
      context: ./frontend
      args:
        # Empty -> the client calls /api on its own origin (nginx-proxied).
        VITE_API_URL: ""
    # Least privilege: no root (set in the images), read-only filesystem except
    # the data volume and /tmp, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # This machine only by default. Other devices use Tailscale (`tailscale
    # serve --bg 5173` gives https://<machine>.<tailnet>.ts.net). Binding to a
    # LAN address instead (BURSA_BIND=0.0.0.0) serves plain HTTP to the network
    # and lets LAN clients set their own X-Forwarded-For (nginx.conf).
    ports:
      - "${BURSA_BIND:-127.0.0.1}:5173:8080"
    depends_on:
      - backend
    restart: unless-stopped
